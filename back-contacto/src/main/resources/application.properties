spring.application.name=back-contacto
server.port=8083

# Conexión a AWS RDS MySQL
spring.datasource.url=jdbc:mysql://${DB_HOST:banco-cloud-db.cmggybjdfvmj.us-east-1.rds.amazonaws.com}:3306/banco_cloud_db
spring.datasource.username=admin
spring.datasource.password=the67mastercrack
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de Hibernate para MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ============================================================
# RabbitMQ - conexión (configurable por variables de entorno para AWS)
# ============================================================
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
# En Amazon MQ usar RABBITMQ_SSL=true y RABBITMQ_PORT=5671
spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL:false}

# ACK manual en los consumidores (basicAck / basicNack explícitos)
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=10
# Si el mensaje falla, no se reencola automáticamente: lo decide el consumidor
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# ============================================================
# RabbitMQ - nombres de exchanges, colas y bindings (centralizados)
# ============================================================
# Exchange principal (topic) y Dead Letter Exchange (direct)
app.rabbitmq.exchange=contactos.exchange
app.rabbitmq.dlx=contactos.dlx

# Caso de uso 1: notificación al crear un contacto
app.rabbitmq.contacto-creado.queue=contactos.creado.queue
app.rabbitmq.contacto-creado.routing-key=contacto.creado
app.rabbitmq.contacto-creado.dlq=contactos.creado.dlq
app.rabbitmq.contacto-creado.dlq-routing-key=contacto.creado.dlq

# Caso de uso 2: generación de ticket/comprobante al validar la cuenta
app.rabbitmq.contacto-validado.queue=contactos.validado.queue
app.rabbitmq.contacto-validado.routing-key=contacto.validado
app.rabbitmq.contacto-validado.dlq=contactos.validado.dlq
app.rabbitmq.contacto-validado.dlq-routing-key=contacto.validado.dlq

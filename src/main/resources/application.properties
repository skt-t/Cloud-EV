server.port=8082
spring.application.name=service

# ============================================================
# Base de datos: AWS RDS MySQL (la clave va SOLO en variable de entorno)
#   export DB_PASSWORD='...'
# ============================================================
spring.datasource.url=jdbc:mysql://${DB_HOST:banco-cloud-db.cmggybjdfvmj.us-east-1.rds.amazonaws.com}:3306/banco_cloud_db
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ============================================================
# Seguridad: JWT emitido por Cognito (se valida con las claves públicas del pool)
# ============================================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cognito-idp.${AWS_REGION:us-east-1}.amazonaws.com/${COGNITO_POOL_ID:us-east-1_bC0FExAyq}

# ============================================================
# RabbitMQ - conexión (usuario 'banco' creado en la EC2; guest no sirve fuera de localhost)
# ============================================================
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:banco}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}

# ACK manual: el consumidor confirma (basicAck) o rechaza (basicNack) explícitamente
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=10
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# ============================================================
# RabbitMQ - nombres centralizados (mapa de mensajería del proyecto)
# ============================================================
app.rabbitmq.exchange=banco.events
app.rabbitmq.dlx=banco.dlx
app.rabbitmq.routing-transferencia=transferencia.realizada
app.rabbitmq.queue-notificaciones=notificaciones.transferencia
app.rabbitmq.queue-comprobante=tickets.comprobante
app.rabbitmq.dlq-notificaciones=notificaciones.transferencia.dlq
app.rabbitmq.dlq-comprobante=tickets.comprobante.dlq

# Consumidor que registra en logs lo que llega a las DLQ.
# Pon false durante la demo si quieres ver los mensajes acumulados en la consola de RabbitMQ.
app.rabbitmq.dlq-logger.enabled=true

spring.application.name=back-contacto
server.port=8083

# ============================================================
# Base de datos: AWS RDS MySQL (la clave va SOLO en variable de entorno)
#   export DB_PASSWORD='...'
# ============================================================
spring.datasource.url=jdbc:mysql://${DB_HOST:banco-cloud-db.cmggybjdfvmj.us-east-1.rds.amazonaws.com}:3306/banco_cloud_db
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ============================================================
# Seguridad: JWT emitido por Cognito (se valida con las claves públicas del pool)
# ============================================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cognito-idp.${AWS_REGION:us-east-1}.amazonaws.com/${COGNITO_POOL_ID:us-east-1_bC0FExAyq}

# ============================================================
# RabbitMQ - conexión (usuario 'banco' creado en la EC2; guest no sirve fuera de localhost)
# ============================================================
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:banco}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}

# ACK manual: el consumidor confirma (basicAck) o rechaza (basicNack) explícitamente
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=10
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# ============================================================
# RabbitMQ - nombres centralizados (mapa de mensajería del proyecto)
# ============================================================
app.rabbitmq.exchange=banco.events
app.rabbitmq.dlx=banco.dlx

# contacto.creado -> notificaciones.contacto (productor y consumidor en este servicio)
app.rabbitmq.contacto-creado.queue=notificaciones.contacto
app.rabbitmq.contacto-creado.routing-key=contacto.creado
app.rabbitmq.contacto-creado.dlq=notificaciones.contacto.dlq
app.rabbitmq.contacto-creado.dlq-routing-key=notificaciones.contacto.dlq

# Consumidor que registra en logs lo que llega a la DLQ.
# Pon false durante la demo si quieres ver los mensajes acumulados en la consola de RabbitMQ.
app.rabbitmq.dlq-logger.enabled=true

# ============================================================
# Kafka Configuration (Parallel to RabbitMQ)
# ============================================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}

spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

spring.kafka.consumer.group-id=notificaciones-contacto-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.back_contacto.dto,com.example.back_contacto.messaging.event,com.example.back_contacto.model
spring.kafka.consumer.properties.spring.json.value.default.type=com.example.back_contacto.messaging.event.ContactoEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false

app.kafka.topic-usuarios=banco.usuarios.events
app.kafka.partitions=3
app.kafka.replicas=3
app.kafka.retention-ms=604800000
app.kafka.cleanup-policy=delete
app.kafka.min-insync-replicas=2


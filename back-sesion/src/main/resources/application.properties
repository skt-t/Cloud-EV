spring.application.name=back-sesion
server.port=8081

# ============================================================
# Base de datos: AWS RDS MySQL (credenciales por variables de entorno)
# La contraseña NO tiene valor por defecto: si DB_PASSWORD no está definida,
# la aplicación no arranca (así no se sube nunca una clave al repositorio).
# ============================================================
spring.datasource.url=jdbc:mysql://${DB_HOST:banco-cloud-db.cmggybjdfvmj.us-east-1.rds.amazonaws.com}:${DB_PORT:3306}/${DB_NAME:banco_cloud_db}
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de Hibernate para MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ============================================================
# Cognito (IDaaS): emisor de los JWT que debe validar el backend.
# Solo se usa al agregar spring-boot-starter-security-oauth2-resource-server.
# ============================================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=${COGNITO_ISSUER:https://cognito-idp.us-east-1.amazonaws.com/us-east-1_bC0FExAyq}

# ============================================================
# RabbitMQ: conexión (misma convención que back-contacto).
# Solo se usa al agregar spring-boot-starter-amqp.
# En la EC2 el broker corre en Docker: usar el usuario "banco", no "guest".
# ============================================================
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=10
spring.rabbitmq.listener.simple.default-requeue-rejected=false

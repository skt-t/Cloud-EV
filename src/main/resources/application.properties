server.port=8084
spring.application.name=admin-service

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER:banco}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cognito-idp.us-east-1.amazonaws.com/${COGNITO_POOL_ID:us-east-1_bC0FExAyq}

app.rabbitmq.management-url=${RABBITMQ_MGMT_URL:http://localhost:15672}
app.rabbitmq.management-user=${RABBITMQ_USER:banco}
app.rabbitmq.management-password=${RABBITMQ_PASSWORD}
app.rabbitmq.dlx=banco.dlx
app.rabbitmq.protected-exchanges=banco.events,banco.dlx
app.rabbitmq.protected-queues=notificaciones.usuario,notificaciones.usuario.dlq,notificaciones.contacto,notificaciones.contacto.dlq,notificaciones.transferencia,notificaciones.transferencia.dlq,tickets.comprobante,tickets.comprobante.dlq
